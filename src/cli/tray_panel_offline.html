<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="light dark" />
<title>Saffev</title>
<style>
  /* Self-contained: shown while the service (and so the Studio, which serves
     the real panel) is down. Same tokens and components as menubar.css so the
     two states read as one product. No network: system font fallback. */
  :root {
    --ground: #F6F7F6; --surface: #FFFFFF; --raised: #EEF1F0; --well: #EEF1F0;
    --line: #E4E8E6; --divider: #EEF1F0;
    --text: #111413; --text-2: #56605E; --text-3: #636C6A;
    --accent: #0E7A68; --accent-soft: #DDF0EC; --on-accent: #FFFFFF;
    --warn: #F2B544; --danger: #B23E32; --danger-soft: #FBE3DF;
    --shadow: 0 24px 60px -18px rgba(17,20,19,.32), 0 2px 8px rgba(17,20,19,.10);
    --tile-border: 1px solid var(--line);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --ground: #111413; --surface: #181C1B; --raised: #262C2B; --well: #232928;
    --line: rgba(255,255,255,.08); --divider: rgba(255,255,255,.05);
    --text: #ECEFEE; --text-2: #A3ABA9; --text-3: #8C9593;
    --accent: #4FD1B5; --accent-soft: rgba(79,209,181,.13); --on-accent: #06231D;
    --danger: #FF8E80; --danger-soft: rgba(255,122,107,.14);
    --shadow: 0 24px 64px -16px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
    --tile-border: 1px solid transparent;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111413; --surface: #181C1B; --raised: #262C2B; --well: #232928;
      --line: rgba(255,255,255,.08); --divider: rgba(255,255,255,.05);
      --text: #ECEFEE; --text-2: #A3ABA9; --text-3: #8C9593;
      --accent: #4FD1B5; --accent-soft: rgba(79,209,181,.13); --on-accent: #06231D;
      --danger: #FF8E80; --danger-soft: rgba(255,122,107,.14);
      --shadow: 0 24px 64px -16px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
      --tile-border: 1px solid transparent;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font: 13px/1.4 "Geist", system-ui, -apple-system, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; overflow: hidden;
  }
  h1, p { margin: 0; }
  .pop { padding: 12px 16px 16px; }
  .panel { width: 380px; background: var(--ground); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .hd { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--well); color: var(--text-3); display: grid; place-items: center; flex: none; }
  .mark svg { width: 18px; height: 18px; }
  .wm { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .wm b { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--text-3); }
  .dot.starting { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .dot.failed { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .3; } }
  .body { padding: 6px 14px 16px; }
  .card { background: var(--surface); border: var(--tile-border); border-radius: 12px; padding: 28px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .well { width: 48px; height: 48px; border-radius: 14px; background: var(--well); color: var(--text-2); display: grid; place-items: center; margin-bottom: 4px; }
  .well.failed { background: var(--danger-soft); color: var(--danger); }
  .well svg { width: 22px; height: 22px; }
  h1 { font-size: 15px; font-weight: 600; }
  p { font-size: 12.5px; color: var(--text-2); }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 12px; }
  .btn {
    appearance: none; border: 0; cursor: pointer; height: 34px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--raised); color: var(--text); font: inherit; font-size: 13px; font-weight: 500;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
  .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn svg { width: 13px; height: 13px; }
  .ft { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-top: 1px solid var(--divider); }
  .ft .ver { flex: 1; font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text-3); }
  .switch { appearance: none; width: 34px; height: 20px; padding: 2px; border: 0; border-radius: 999px; background: var(--raised); cursor: pointer; }
  .switch span { display: block; width: 16px; height: 16px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s ease; }
  .switch.on { background: var(--accent); }
  .switch.on span { transform: translateX(14px); }
  .login { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
  .quiet { appearance: none; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 12px; height: 30px; padding: 0 10px; border-radius: 7px; cursor: pointer; }
  .quiet:hover { background: var(--raised); color: var(--text); }
  @media (prefers-reduced-motion: reduce) { .dot.starting { animation: none; } }
</style>
</head>
<body>
<div class="pop">
  <section class="panel" role="dialog" aria-label="Saffev">
    <header class="hd">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 512 512" fill="currentColor"><path d="M34 242H52C68 242 78 230 81 214L96 100C102 54 139 24 186 24H326C373 24 410 54 416 100L431 214C434 230 444 242 460 242H478V250H442C414 250 396 268 382 294C368 320 354 336 330 336C306 336 291 315 276 283L246 219C232 188 220 164 196 164C172 164 158 183 144 207C126 238 110 250 82 250H34Z"/><path d="M34 270H82C110 270 126 258 144 227C158 203 172 192 196 192C220 192 232 216 246 247L276 311C291 343 306 364 330 364C354 364 368 348 382 322C396 296 414 278 442 278H478V270H460C444 270 434 282 431 298L416 412C410 458 373 488 326 488H186C139 488 102 458 96 412L81 298C78 282 68 270 52 270Z"/></svg></span>
      <div class="wm"><b id="name">Saffev</b><span class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></span></div>
    </header>
    <div class="body">
      <div class="card">
        <span class="well" id="well" aria-hidden="true"><svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
        <h1 id="msg">Recording is paused</h1>
        <p id="sub">Nothing new is captured or preserved.</p>
        <div class="pair">
          <button class="btn primary" id="btnStart"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><span id="startLabel">Start</span></button>
          <button class="btn" id="btnLogs">Open logs</button>
        </div>
      </div>
    </div>
    <footer class="ft">
      <span class="ver" id="ver"></span>
      <span class="login">Open at login <button class="switch" id="login" role="switch" aria-checked="false" aria-label="Open at login"><span></span></button></span>
      <button class="quiet" id="btnQuit" title="Quit the menu-bar app">Quit</button>
    </footer>
  </section>
</div>
<script>
(function () {
  'use strict';
  var ipc = function (m) { try { window.ipc && window.ipc.postMessage(JSON.stringify(m)); } catch (e) {} };
  var $ = function (s) { return document.querySelector(s); };
  var host = { status: 'starting', statusText: 'Connecting…' };
  var PAUSE = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  var ALERT = '<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/>';
  var CLOCK = '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';

  function render() {
    var s = host.status || 'stopped';
    $('#dot').className = 'dot ' + s;
    $('#statusText').textContent = s === 'starting' ? 'Starting…' : s === 'failed' ? 'Failed to start' : s === 'running' ? 'Loading…' : 'Stopped';
    $('#name').textContent = host.appName || 'Saffev';
    $('#ver').textContent = host.version ? 'v' + host.version : '';
    var login = $('#login');
    login.className = 'switch' + (host.loginEnabled ? ' on' : '');
    login.setAttribute('aria-checked', host.loginEnabled ? 'true' : 'false');
    var msg = $('#msg'), sub = $('#sub'), start = $('#btnStart'), well = $('#well'), icon = $('#icon');
    well.className = 'well';
    if (s === 'starting' || s === 'running') {
      icon.innerHTML = CLOCK;
      msg.textContent = s === 'running' ? 'Opening the panel…' : 'Starting Saffev…';
      sub.textContent = 'If macOS asks about the “saffev” keychain item, allow it.';
      $('#startLabel').textContent = 'Starting…'; start.disabled = true;
    } else if (s === 'failed') {
      icon.innerHTML = ALERT; well.className = 'well failed';
      msg.textContent = 'Saffev couldn’t start';
      sub.textContent = 'The log has the cause.';
      $('#startLabel').textContent = 'Try again'; start.disabled = false;
    } else {
      icon.innerHTML = PAUSE;
      msg.textContent = 'Recording is paused';
      sub.textContent = 'Nothing new is captured or preserved.';
      $('#startLabel').textContent = 'Start'; start.disabled = false;
    }
  }

  window.__saffevHost = {
    setState: function (s) {
      host = s || host;
      if (host.theme === 'light' || host.theme === 'dark') document.documentElement.setAttribute('data-theme', host.theme);
      else document.documentElement.removeAttribute('data-theme');
      render();
    },
    onShow: function () {},
    onHide: function () {},
    notice: function () {}
  };
  $('#btnStart').addEventListener('click', function () { ipc({ cmd: 'start' }); });
  $('#btnLogs').addEventListener('click', function () { ipc({ cmd: 'logs' }); });
  $('#btnQuit').addEventListener('click', function () { ipc({ cmd: 'quit' }); });
  $('#login').addEventListener('click', function () { ipc({ cmd: 'set_login', enabled: !host.loginEnabled }); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') ipc({ cmd: 'close' }); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // Report our height so the window hugs the card.
  var report = function () { var p = document.querySelector('.panel'); if (p) ipc({ cmd: 'resize', height: p.offsetHeight + 30 }); };
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.querySelector('.panel'));
  render(); report();
  ipc({ cmd: 'ready' });
})();
</script>
</body>
</html>
