# Build, sign, notarize and attach the macOS menu-bar app as a drag-install DMG.
#
# WHY THIS EXISTS
# ---------------
# `Saffev.app` was previously packaged by running `scripts/package-macos-app.sh`
# by hand on the maintainer's Mac and uploading the result. That step is easy to
# forget, and it was: the DMG shipped in v0.4.2 and then silently went missing for
# v0.5.0 and v0.6.0, leaving the README's prominent "prefer a menu-bar app?"
# download link returning 404 for two releases running.
#
# Worse, `target/` is not cleaned between local runs, so a stale DMG from an older
# version sits around looking like fresh output — one careless upload away from
# publishing an old binary under a new tag.
#
# Everything needed to do this properly already lives in Actions: the Developer ID
# certificate and the notarytool credentials, both proven working by the existing
# release + notarize jobs. So it belongs here, not on a laptop.
#
# TRIGGERS
#   workflow_call     — from release.yml, so every future tag ships the DMG.
#   workflow_dispatch — with a tag, to attach a DMG to a release that already
#                       exists (which is how v0.6.0 gets fixed without re-cutting).
#
# The runner is macos-14 (Apple Silicon), so the artifact is arm64 — matching the
# `Saffev-macos-arm64.dmg` name the README links to.

name: Package macOS DMG

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      APPLE_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      CODESIGN_CERTIFICATE:
        required: false
      CODESIGN_CERTIFICATE_PASSWORD:
        required: false
      CODESIGN_IDENTITY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the DMG to (e.g. v0.6.0)"
        required: true
        type: string

jobs:
  package-dmg:
    name: Build + notarize Saffev.app DMG
    runs-on: macos-14
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
      CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}

    steps:
      - name: Check for signing + notarization credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          # Skip cleanly rather than failing the release when a fork or a
          # contributor without secrets runs this.
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] \
             && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${CODESIGN_CERTIFICATE:-}" ] \
             && [ -n "${CODESIGN_CERTIFICATE_PASSWORD:-}" ] && [ -n "${CODESIGN_IDENTITY:-}" ]; then
            echo "have_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=DMG skipped::Signing/notarization secrets are not all set; skipping the macOS DMG."
          fi

      - name: Resolve the release tag
        if: steps.creds.outputs.have_creds == 'true'
        id: tag
        shell: bash
        env:
          PLAN: ${{ inputs.plan }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # workflow_dispatch supplies the tag directly; workflow_call gets it
          # from dist's plan, the same way the notarize job does.
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(printf '%s' "$PLAN" | jq -r '.announcement_tag')"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error title=No tag::could not resolve a release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Packaging DMG for $TAG"

      # Check out the code AT THE TAG, not the default branch. The DMG must
      # contain the version it is published against; building from main would
      # reintroduce exactly the stale-artifact problem this job exists to end.
      - uses: actions/checkout@v4
        if: steps.creds.outputs.have_creds == 'true'
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Verify the checkout matches the tag
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          CARGO_VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          EXPECTED="${TAG#v}"
          if [ "$CARGO_VER" != "$EXPECTED" ]; then
            echo "::error title=Version mismatch::tag $TAG implies $EXPECTED but Cargo.toml says $CARGO_VER"
            exit 1
          fi
          echo "Cargo.toml $CARGO_VER matches $TAG"

      - name: Import the Developer ID certificate
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/saffev-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CODESIGN_CERTIFICATE" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$CODESIGN_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"

          # Without this, codesign blocks on a UI prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # Make this the DEFAULT keychain and put it first in the search list.
          #
          # Deliberately not passed to the packaging script as a flag: this job
          # checks out at the release TAG, so it runs whatever version of
          # `package-macos-app.sh` shipped with that release. A CI-only flag added
          # later would not exist there, and CI must be able to package any tag —
          # including ones cut before the flag existed. Making the keychain the
          # default means `codesign` and `notarytool` both find what they need
          # with no extra arguments.
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | head -3

      - name: Store notarytool credentials
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The packaging script takes a keychain profile name. Create it here from
          # the same Apple-ID secrets the notarize job already uses.
          # Written to the default keychain (set to ours in the previous step),
          # so the tagged script finds the profile without a --keychain argument.
          xcrun notarytool store-credentials "saffev-ci" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" >/dev/null
          echo "notarytool profile stored"

      - name: Build, sign, notarize, and staple the DMG
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The script builds the release binary with the `tray` feature, assembles
          # Saffev.app, signs it, notarizes + staples it, then wraps it in a
          # drag-install DMG which is itself signed, notarized and stapled.
          # Only flags that have existed since the DMG was first packaged, so this
          # works against older tags too.
          scripts/package-macos-app.sh \
            --sign "$CODESIGN_IDENTITY" \
            --notarize "saffev-ci"

      - name: Verify Gatekeeper accepts the DMG
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DMG="target/Saffev-macos-arm64.dmg"
          test -f "$DMG" || { echo "::error title=No DMG::$DMG was not produced"; exit 1; }

          # The check that actually matters to a user double-clicking a download.
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          xcrun stapler validate "$DMG"
          ls -lh "$DMG"

      - name: Attach the DMG to the release
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "target/Saffev-macos-arm64.dmg" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached Saffev-macos-arm64.dmg to $TAG"

      - name: Confirm the README download link resolves
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Saffev-macos-arm64.dmg"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -L "$URL")"
          if [ "$CODE" != "200" ]; then
            # Not fatal: attaching to an older tag legitimately leaves /latest/
            # pointing elsewhere. Say so rather than failing a good build.
            echo "::warning title=latest/ link not 200::$URL returned $CODE (expected if this tag is not the latest release)"
          else
            echo "README download link resolves: $URL"
          fi

      - name: Remove the signing keychain
        if: always()
        shell: bash
        run: |
          # Runners are ephemeral, but never leave a private key sitting in a
          # keychain that a later step in the same job could reach.
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "${SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
            echo "signing keychain removed"
          fi
