<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Saffev — local ai studio</title>

  <!-- Transparent, self-hosted brand mark. It is embedded in the binary with
       the rest of Studio and switches to the brighter brand green in dark UI. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Self-hosted fonts (woff2 baked into the binary) — no CDN, fully offline. -->
  <link rel="stylesheet" href="/fonts.css" />

  <!-- Canonical design tokens (copied from design/tokens.css) — single colour source. -->
  <link rel="stylesheet" href="/tokens.css" />
  <!-- Component styles lifted from design/option-a-calm-instrument.html (token-driven). -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="appshell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 512 512" fill="currentColor">
            <path d="M34 242H52C68 242 78 230 81 214L96 100C102 54 139 24 186 24H326C373 24 410 54 416 100L431 214C434 230 444 242 460 242H478V250H442C414 250 396 268 382 294C368 320 354 336 330 336C306 336 291 315 276 283L246 219C232 188 220 164 196 164C172 164 158 183 144 207C126 238 110 250 82 250H34Z"/>
            <path d="M34 270H82C110 270 126 258 144 227C158 203 172 192 196 192C220 192 232 216 246 247L276 311C291 343 306 364 330 364C354 364 368 348 382 322C396 296 414 278 442 278H478V270H460C444 270 434 282 431 298L416 412C410 458 373 488 326 488H186C139 488 102 458 96 412L81 298C78 282 68 270 52 270Z"/>
          </svg>
        </div>
        <div class="wm"><span id="wmName">Saffev</span><small id="wmSub">local ai studio</small></div>
      </div>

      <div class="navlabel">Observe</div>
      <nav class="nav" id="navObserve">
        <a data-route="timeline" href="#/timeline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><circle cx="12" cy="7" r="2.2"/><circle cx="12" cy="16" r="2.2"/><path d="M14.2 7H20M4 16h5.8"/></svg> Timeline
        </a>
        <a data-route="live" href="#/live">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l3 8 4-16 3 8h6"/></svg> Live
        </a>
        <a data-route="history" href="#/history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> History
        </a>
        <a data-route="agents" href="#/agents">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 0-4 4v1H7a3 3 0 0 0-3 3v2a3 3 0 0 0 3 3h1v1a4 4 0 0 0 8 0v-1h1a3 3 0 0 0 3-3v-2a3 3 0 0 0-3-3h-1V6a4 4 0 0 0-4-4Z"/><path d="M9 11h.01M15 11h.01"/></svg> Agents
        </a>
        <a data-route="analytics" href="#/analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 16V9M13 16V6M18 16v-4"/></svg> Analytics
          <span class="badge" id="navPiiBadge" hidden>0</span>
        </a>
      </nav>

      <div class="navlabel">Manage</div>
      <nav class="nav" id="navManage">
        <a data-route="engines" href="#/engines">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg> Engines
        </a>
        <a data-route="settings" href="#/settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.3 1a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.6a7 7 0 0 0 .1-1Z"/></svg> Settings
        </a>
      </nav>

      <div class="navlabel">Learn</div>
      <nav class="nav" id="navLearn">
        <a data-route="about" href="#/about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg> About &amp; integrate
        </a>
      </nav>

      <!-- Update affordance (bottom-left). Populated by app.js when GET /api/update
           reports a newer release; clicking installs + relaunches automatically. -->
      <div class="upfoot" id="updateFoot" hidden></div>
      <div class="foot">Everything stays on this device. <b>Encrypted</b> · no telemetry.</div>
    </aside>

    <!-- MAIN -->
    <main class="main" id="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Live</h1>
          <div class="sub" id="pageSub">What your apps are doing with local models — right now.</div>
        </div>
        <div class="spacer"></div>
        <span class="pill" id="enginePill"><span class="dot"></span> <span id="enginePillText">connecting…</span></span>
        <button class="iconbtn alert-bell" id="alertBell" title="Leak alerts" aria-label="Leak alerts" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="count" id="alertCount" hidden>0</span>
        </button>
        <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
          <svg id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </header>

      <!-- Connection banner (token / fetch errors) -->
      <div class="banner" id="banner" hidden></div>

      <!-- View root — pages render here -->
      <section id="view"></section>
    </main>
  </div>

  <script src="/charts.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
